baseURL = 'https://centriauniversityofappliedsciences.github.io/DigiBioGasHub'
languageCode = 'en-us'
title = 'DigiBioGasHubs Documentation'
contentDir = 'content'
enableEmoji = true
timeZone = 'Europe/Helsinki'

[module]
    # uncomment line below for temporary local development of module
    # or when using a 'theme' as a git submodule
    replacements = "github.com/colinwilson/lotusdocs -> lotusdocs"
    [[module.imports]]
        path = "github.com/colinwilson/lotusdocs"
        disable = false
    [[module.imports]]
        path = "github.com/gohugoio/hugo-mod-bootstrap-scss/v5"
        disable = false
 [[module.mounts]]
  source = 'static'
  target = 'assets'
[markup]
    [markup.tableOfContents]
      endLevel = 3
      startLevel = 1
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true # https://jdhao.github.io/2019/12/29/hugo_html_not_shown/
  [markup.goldmark.parser]
    [markup.goldmark.parser.attribute]
      block = true

[params.social]
    github = 'CentriaUniversityOfAppliedSciences'

[params.docs]
    sidebarIcons = true
    darkMode = true

[caches]
  [caches.images]
    dir = ':cacheDir/images'
    